{% extends 'base.html' %}

{% block content %}
<div class="container" style="padding: 2rem 0;">
    <div class="section-header">
        <h2>{% if article %}Modifier l'article{% else %}Ajouter un article{% endif %}</h2>
    </div>

    <form method="post" style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        {% csrf_token %}
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Titre *</label>
            <input type="text" name="title" value="{% if article %}{{ article.title }}{% endif %}" 
                   style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;" required>
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Slug (URL) *</label>
            <input type="text" name="slug" value="{% if article %}{{ article.slug }}{% endif %}" 
                   style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;" required>
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Catégorie *</label>
            <select name="category" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;" required>
                <option value="">Choisir...</option>
                <option value="reforme" {% if article and article.category == 'reforme' %}selected{% endif %}>Réforme</option>
                <option value="innovation" {% if article and article.category == 'innovation' %}selected{% endif %}>Innovation</option>
                <option value="initiative" {% if article and article.category == 'initiative' %}selected{% endif %}>Initiative</option>
                <option value="resultat" {% if article and article.category == 'resultat' %}selected{% endif %}>Résultat</option>
                <option value="interview" {% if article and article.category == 'interview' %}selected{% endif %}>Interview</option>
                <option value="conseil" {% if article and article.category == 'conseil' %}selected{% endif %}>Conseil</option>
            </select>
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Extrait (résumé) *</label>
            <textarea name="excerpt" rows="3" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;" required>{% if article %}{{ article.excerpt }}{% endif %}</textarea>
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Contenu *</label>
            <textarea name="content" rows="15" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;" required>{% if article %}{{ article.content }}{% endif %}</textarea>
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Auteur</label>
            <input type="text" name="author" value="{% if article %}{{ article.author }}{% else %}Admin{% endif %}" 
                   style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">URL de l'image</label>
            <input type="text" name="image_url" value="{% if article %}{{ article.image_url }}{% endif %}" 
                   style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;" placeholder="/static/images/nom-image.jpg">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Statut</label>
            <select name="status" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                <option value="draft" {% if article and article.status == 'draft' %}selected{% endif %}>Brouillon</option>
                <option value="published" {% if article and article.status == 'published' %}selected{% endif %}>Publié</option>
            </select>
        </div>
        
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary btn-large">
                {% if article %}Modifier{% else %}Publier{% endif %}
            </button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline btn-large">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
