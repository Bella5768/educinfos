{% extends 'base.html' %}

{% block content %}
<section class="article-detail">
    <div class="container">
        <article class="article-full">
            <div class="article-header">
                <div class="article-meta">
                    <span class="article-date">
                        <i class="fas fa-calendar"></i>
                        {{ article.published_date|date:"d F Y" }}
                    </span>
                    <span class="article-category">{{ article.get_category_display }}</span>
                    <span class="article-author">
                        <i class="fas fa-user"></i>
                        {{ article.author }}
                    </span>
                </div>
                <h1>{{ article.title }}</h1>
            </div>
            {% if article.image_url %}
            <div class="article-image-full">
                <img src="{{ article.image_url }}" alt="{{ article.title }}">
            </div>
            {% endif %}
            <div class="article-body">
                {{ article.content|linebreaks }}
            </div>
            <div class="article-footer">
                <a href="{% url 'articles_list' %}" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Retour aux articles
                </a>
            </div>
        </article>
    </div>
</section>
{% endblock %}
